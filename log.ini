[loggers]
keys=root,errorLogger

[handlers]
keys=logfile,consoleHandler,errorlog

[formatters]
keys=logfileformatter

[logger_root]
level=INFO
handlers=logfile,consoleHandler

[logger_errorLogger]
level=ERROR
handlers=errorlog
qualname=errorLogger

[formatter_logfileformatter]
format=[%(asctime)s.%(msecs)03d] %(levelname)s [%(thread)d] - %(message)s

[handler_logfile]
class=handlers.RotatingFileHandler
level=INFO
args=('access.log','a',100000000,3,'utf-8')
formatter=logfileformatter

[handler_errorlog]
class=handlers.RotatingFileHandler
level=ERROR
args=('error.log', 'a', 100000000, 3, 'utf-8')
formatter=logfileformatter

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=logfileformatter
args=(sys.stdout,)